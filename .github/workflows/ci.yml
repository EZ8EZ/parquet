name: CI

# Runs on every PR and on direct pushes to main. The three gates here are the
# same three the team runs locally before every commit, so a green check means
# the same thing in both places - no CI-only rules, no locally-only rules.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run pointless; cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the datasource url even though it never connects.
      # A syntactically valid placeholder keeps generate happy without a real DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code that nothing commits, so typecheck
      # cannot see the model types until this runs.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # The fixture provider needs no network and no league credentials, which is
      # exactly why it exists: a build check that cannot fail on someone else's
      # rate limit is the only kind worth blocking a merge on.
      LEAGUE_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (Playwright smoke)
    runs-on: ubuntu-latest
    # NON-BLOCKING FOR NOW. This job is new and hasn't yet proven itself stable
    # under CI's own timing and concurrency (as opposed to a developer's machine),
    # so a flake here must not be able to block a merge. `continue-on-error: true`
    # keeps the check visible on the PR without gating it. Branch protection on
    # main currently requires exactly "typecheck / lint / test" and "build" (the
    # `gate` and `build` jobs above) - this job is deliberately NOT added to that
    # required list. Once it has run green across a normal week of real PRs with
    # no flakes, promote it to required the same way those two were.
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Same reason the `build` job uses it: no network, no league credentials,
      # so this job can't fail on someone else's rate limit or a stale session.
      LEAGUE_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code that nothing commits - same reason
      # the `gate` job runs this before typecheck.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium (+ OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
