name: CI

# Runs on every PR and on direct pushes to main. The gates here are the same
# ones the team runs locally before every commit, so a green check means the
# same thing in both places - no CI-only rules, no locally-only rules.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run pointless; cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint / test
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the datasource url even though it never connects.
      # A syntactically valid placeholder keeps generate happy without a real DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code that nothing commits - importing
      # @prisma/client without this having run first fails before a single
      # test does.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # The fixture provider needs no network and no league credentials, which is
      # exactly why it exists: a build check that cannot fail on someone else's
      # rate limit is the only kind worth blocking a merge on.
      LEAGUE_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (Playwright smoke)
    runs-on: ubuntu-latest
    # BLOCKING AS OF THIS COMMIT. This job shipped with `continue-on-error: true`
    # and an explicit condition for lifting it: "once it has run green across a
    # normal week of real PRs with no flakes, promote it to required the same way
    # those two were." That condition is met - it has run green on every run of
    # this wave, across every feature branch and every merge to main, with no
    # flakes and no reruns. `continue-on-error` is therefore gone: a Playwright
    # failure now fails the job, which is the whole point of running it.
    #
    # ONE HALF OF THE PROMOTION IS NOT IN THIS FILE. Branch protection on main
    # lives in GitHub repo settings, not in the repo, and still requires exactly
    # "typecheck / lint / test" and "build" (the `gate` and `build` jobs above) -
    # a NAME the `gate` job no longer produces (TypeScript is gone; it renamed
    # to "lint / test"). Until an owner updates the required-checks list to the
    # new name AND adds "e2e (Playwright smoke)", GitHub will show that old,
    # renamed check as perpetually pending on every future PR and will refuse to
    # let the merge button go green - not a lint/test/e2e failure, a required
    # check that can no longer report at all. Both are the same one-click owner
    # action: Settings -> Branches -> main -> Require status checks -> remove
    # "typecheck / lint / test", add "lint / test" and "e2e (Playwright smoke)".
    # The e2e half is worth doing regardless of the rename, because the
    # Playwright smoke suite is the ONLY coverage the rendering layer has - 29 of
    # 32 components carry no unit test - so it is the one check that can catch a
    # page that throws on load, and 949 green unit tests cannot.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Same reason the `build` job uses it: no network, no league credentials,
      # so this job can't fail on someone else's rate limit or a stale session.
      LEAGUE_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code that nothing commits - same reason
      # the `gate` job runs this before lint/test.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium (+ OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
