<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Parquet">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c268"/>
      <stop offset="1" stop-color="#c9922f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0c0e"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#262b33" stroke-width="4"/>
  <!-- Herringbone parquet planks forming a chevron -->
  <g transform="translate(256 262)">
    <g fill="url(#g)">
      <rect x="-150" y="-24" width="150" height="48" rx="10" transform="rotate(45 -75 0)"/>
      <rect x="0"    y="-24" width="150" height="48" rx="10" transform="rotate(-45 75 0)"/>
      <rect x="-150" y="-24" width="150" height="48" rx="10" transform="translate(0 -104) rotate(45 -75 0)" opacity="0.72"/>
      <rect x="0"    y="-24" width="150" height="48" rx="10" transform="translate(0 -104) rotate(-45 75 0)" opacity="0.72"/>
      <rect x="-150" y="-24" width="150" height="48" rx="10" transform="translate(0 104) rotate(45 -75 0)" opacity="0.72"/>
      <rect x="0"    y="-24" width="150" height="48" rx="10" transform="translate(0 104) rotate(-45 75 0)" opacity="0.72"/>
    </g>
  </g>
</svg>
